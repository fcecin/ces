# config_ces_pubcom_org.toml -- the live config for the public CES node
# (ces.pubcom.org). It carries no private key: server_key is left unset and
# provided at launch with -k, so no key ever sits in this committed file.
#
# Seeded from `ces --config` (every current option at its default); comments
# mark only the values this node overrides, with why.

log_level = "info"
data_dir = "./data"
port = 53830

# server_key is intentionally unset so no key is committed. Provide the real key
# at launch with -k. Without it, ces uses the well-known sample key and logs a
# loud boot warning (it will not silently run a real key).
# server_key = "<provide with -k>"

# Public address advertised to peers for discovery.
server_name = "ces.pubcom.org:53830"

# Production scarcity: ~minutes per solution on modern hardware (default 10 is dev-fast).
min_difficulty = 15

# Let the RandomX dataset finish initializing before solutions count.
pow_delay = 120

spend_slot_size = 3600
no_pow_engine = false
# Verify with the RandomX cache (about 256 MB), not the full dataset (about
# 2.5 GB). Other CES servers share this box.
cache_only_pow = true

# Pinned to a fixed value (not auto-derived from the host core count).
threads = 2

# 2^22 accounts and 2^20 assets at most, with 2^16 of each reserved at boot.
min_accounts = 65536
max_accounts = 4194304
min_assets = 65536
max_assets = 1048576

# Batch writes under production load instead of flushing every change.
flush_value = 10000

# Keep the WAL small so it compacts often (also keeps restart-replay fast).
max_log_size_gb = 2

fee_account = -1
# Fee schedule for the public node, above the built-in defaults.
fee_asset = 38400000
fee_tx = 320000
fee_query = 80000
fee_vm_mult = -1

peer_target = 0

# Reciprocate inbound peer PoW 1:1 (mine back as much as a peer mines on us).
peer_pow_inbound_reciprocation_bps = 10000

max_peer_reserve_disturbance = 100000
settlement_max_retries = 7
gossip_fanout_degree = 6

# Enable the CesPlex / L2 stack (file/lua/compute/peer) + SYS_RPC on this UDP
# port. 53831 is the conventional CES rpc port (main + 1, DEFAULT_RPC_PORT);
# clients assume it when an address names no port.
rpc_port = 53831

rpc_max_pending = 1000
rpc_max_request_bytes = 65536
rpc_max_response_bytes = 65536
rpc_response_timeout_ms = 30000
rpc_rudp_bytes_per_second = 4294967295
rpc_rudp_burst_bytes = 4294967295

# 40 GiB metered user storage (/h/ /f/ /p/); /s/ is unmetered and always served.
file_store_max_bytes = 42949672960
file_store_dir = ""
# Extension catalog for the dashboard's install button (deployed next to ces).
extensions_dir = "./extensions"
ext_funding_per_day = 500000000
ext_local_budget = 100000000000
fee_file_rent = -1
fee_file_write = -1
fee_file_read = -1

# Compute on: 24 Lua instances of at most 256 MiB each (6 GiB at most). The
# extensions run under the same limit and reach about 210 MB of address
# space. The child binary is auto-discovered next to ces.
compute_max_instances = 24
compute_process_mem_max = 268435456
# A fixed UDP range for instance ports, so a firewall can open exactly these.
# Each instance and each extension takes two ports (its client and its rpc
# host).
compute_port_base = 53900
compute_port_count = 100

# Operator dashboard: loopback-only, NO AUTH by design -- reach it over an SSH
# tunnel (ssh -N -L 8080:localhost:8080 ...). Must stay at top-level scope; a
# web_port under a [table] is silently ignored.
web_port = 8080
web_bind = "127.0.0.1"

# builtin:think: text in, text out (DeepSeek, OpenAI format). The key is in
# think.key (mode 600), never in this file. Prices are the anti-leech peg
# (1 credit ~ $0.0001, 2x margin) over DeepSeek flash peak prices, in raw
# credit units per 1M tokens: in $0.30, cached $0.006, out $1.20.
think_base_url        = "https://api.deepseek.com"
think_model           = "deepseek-flash"
think_api_key_file    = "./think.key"
think_reasoning       = false
think_fee_in          = 600000000000
think_fee_cached_in   = 12000000000
think_fee_out         = 2400000000000
think_max_out_tokens  = 4096
think_max_input_bytes = 1048576
think_context_tokens  = 131072    # ceiling on the model's window told to callers (128K)
think_timeout_secs    = 300
think_max_concurrent  = 8
# Global subsidy: up to 99.99% off while nobody thinks. Worst case 2000
# credits (~$0.10 at the peg) at once plus 1000 credits (~$0.05) a day.
think_subsidy_budget   = 200000000000
think_subsidy_tau_secs = 172800
think_subsidy_floor_bp = 1

# L2 handlers wired on: file + lua + compute + the peer mesh. Nothing
# auto-mounts; the peer mesh must be listed here too.
[cesplex_mounts]
"/ces/think/1"   = "builtin:think"
"/ces/file/1"    = "builtin:file"
"/ces/lua/1"     = "builtin:lua"
"/ces/compute/1" = "builtin:compute"
"/ces/peer/1"    = "builtin:peer"

[rpc_rudp]
# 4 channels/peer so cesh can hold a long-lived dial while issuing side ops.
max_channels_per_peer = 4
max_reorder_bytes_per_channel = -1
max_reorder_msgs_per_channel = -1
# Long idle window for interactive dial terminals (humans pause between commands).
channel_idle_secs = 600

# Autolaunched /s/ extensions (their .lua sources live in the file store's /s/ zone).
[extension]
dice = 1
discovery = 1
peerfunder = 1
monitor = 1
cwb = 1
vellum = 1

# The fc network on this box (fc/deploy/README.md): its ledger and the
